[project]
name = "firms-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for NASA's Fire Information for Resource Management System (FIRMS)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastmcp>=4.1,<5",
    "mcp>=2.3,<3",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pyyaml>=6.0.2",
    "pydantic-settings>=2.10",
]

[project.scripts]
firms-mcp = "firms_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "respx>=0.22",
    "ruff>=0.14",
]
sync = [
    "beautifulsoup4>=4.13",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firms_mcp"]

[tool.hatch.build.targets.wheel.force-include]
# The knowledge base ships inside the wheel (ADR-0005) so `uvx firms-mcp` works offline.
"knowledge" = "firms_mcp/_knowledge"


[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["knowledge"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["firms_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "-m", "not live"]
markers = [
    "req(*ids): requirement IDs (docs/project/requirements.yaml) verified by this test",
    "live: calls the real FIRMS API; requires FIRMS_MAP_KEY; excluded by default",
]

[tool.coverage.run]
source = ["firms_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
