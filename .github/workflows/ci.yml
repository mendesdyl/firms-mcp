# Quality gates (ADR-0008, ADR-0012): lint, types, tests, tool contracts, the requirements
# traceability matrix, build, a stdio smoke test, an audit of the dependencies the server
# ships with, and the container image. Nothing here contacts FIRMS.
name: CI

on:
  push:
    branches: ["main"]
  pull_request: {}
  # Lets the knowledge-sync workflow start CI on its branch: pull requests opened with the
  # workflow's own token do not trigger `pull_request` runs.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "26"]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint and format
        run: npx biome ci .

      - name: Type-check
        run: npm run typecheck

      - name: Validate the knowledge base
        run: npm run knowledge -- validate

      - name: Tests
        run: npm test

      - name: Tool contracts are current
        run: npm run contracts:check

      - name: Traceability matrix is current
        run: npm run traceability:check

      - name: Build
        run: npm run build

      - name: Smoke test over stdio
        run: npm run smoke

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build the container image
        run: docker build -t firms-mcp:ci .

      - name: Start the container and check its endpoints
        run: |
          docker run -d --name firms-mcp -p 8000:8000 firms-mcp:ci
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health | grep -q '"tools":7'
          curl -fsS -X POST http://127.0.0.1:8000/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: tools/list' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{},"io.modelcontextprotocol/clientInfo":{"name":"ci","version":"1"}}}}' \
            | tee /dev/stderr | grep -q firms_build_api_url

      - name: Container logs
        if: always()
        run: docker logs firms-mcp || true
