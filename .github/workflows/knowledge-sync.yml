# FIRMS FAQ sync on GitHub's runners (ADR-0011 §6, FR-KB-011), started by hand only. The FAQ
# page answers GitHub's runners with HTTP 403 (integration issue II-28), so the weekly sync runs
# from the owner's Mac instead (scripts/mac/knowledge-sync.sh; Operations §4.2). This workflow
# does the same steps when started from the Actions tab: regenerate the FAQ entries and the
# missing-data table, run every check, and open or update the review pull request.
name: Knowledge sync

on:
  workflow_dispatch: {}

permissions:
  contents: write # push the sync branch
  pull-requests: write # open the review pull request
  actions: write # start CI on the sync branch (pull requests opened by this token do not)

concurrency:
  group: knowledge-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync the FAQ and missing-data table
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails (and GitHub notifies the owner) if the page no longer parses into a plausible
      # FAQ; the last good entries are left untouched (FR-KB-012).
      - name: Sync the FAQ
        run: npm run knowledge -- sync

      # The table is undocumented and slow; if it cannot be read, the previous copy is kept and
      # the pull request says so.
      - name: Save the missing-data table
        id: missing
        continue-on-error: true
        run: npm run knowledge -- missing-data

      - name: Run every check on the result
        run: npm run check

      - name: Open or update the review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          MISSING_OUTCOME: ${{ steps.missing.outcome }}
        run: |
          if [ -z "$(git status --porcelain -- knowledge)" ]; then
            echo "No changes to the FAQ or the missing-data table."
            exit 0
          fi
          day=$(date -u +%F)
          # One rolling branch: each run starts from main, so an unmerged sync is replaced by a
          # newer one that contains all changes since main.
          branch="knowledge-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add knowledge
          git commit -m "chore(knowledge): FIRMS FAQ sync $day"
          git push --force origin "$branch"

          npm run --silent knowledge -- pr-body --missing "$MISSING_OUTCOME" --base origin/main > "$RUNNER_TEMP/body.md"

          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --title "chore(knowledge): FIRMS FAQ sync $day" --body-file "$RUNNER_TEMP/body.md"
          elif ! gh pr create --base main --head "$branch" \
              --title "chore(knowledge): FIRMS FAQ sync $day" --body-file "$RUNNER_TEMP/body.md"; then
            echo "::error::Could not open the pull request. Enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests', or open it by hand: https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}"
            exit 1
          fi
          gh workflow run ci.yml --ref "$branch"
